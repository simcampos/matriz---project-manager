name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: matriz_ci
          POSTGRES_USER: matriz
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matriz -d matriz_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-placeholder
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: matriz_ci
      POSTGRES_USER: matriz
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check Django configuration
        run: python backend/manage.py check

      - name: Run backend tests
        run: python backend/manage.py test config.tests apps.accounts apps.projects apps.tasks apps.comments

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker buildx build --target production --load --tag matriz-backend:ci --file backend/Dockerfile ./backend

      - name: Build frontend image
        run: docker buildx build --load --tag matriz-frontend:ci --file frontend/Dockerfile ./frontend

      - name: Verify Docker images
        run: docker image inspect matriz-backend:ci matriz-frontend:ci

  deploy:
    needs: build
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_API_SERVICE_ID: ${{ vars.RENDER_API_SERVICE_ID }}
      RENDER_FRONTEND_SERVICE_ID: ${{ vars.RENDER_FRONTEND_SERVICE_ID }}
    steps:
      - name: Validate Render deployment configuration
        run: |
          set -euo pipefail
          : "${RENDER_API_KEY:?Add RENDER_API_KEY to the production environment secrets}"
          : "${RENDER_API_SERVICE_ID:?Add RENDER_API_SERVICE_ID to the production environment variables}"
          : "${RENDER_FRONTEND_SERVICE_ID:?Add RENDER_FRONTEND_SERVICE_ID to the production environment variables}"

      - name: Deploy API commit to Render
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.render.com/v1/services/${RENDER_API_SERVICE_ID}/deploys" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data "{\"commitId\":\"${GITHUB_SHA}\"}"

      - name: Deploy frontend commit to Render
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.render.com/v1/services/${RENDER_FRONTEND_SERVICE_ID}/deploys" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data "{\"commitId\":\"${GITHUB_SHA}\"}"
