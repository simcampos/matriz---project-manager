services:
  - type: web
    name: matriz-project-manager-api
    runtime: docker
    region: frankfurt
    plan: free
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeployTrigger: off
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: matriz-project-manager-web.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://matriz-project-manager-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: matriz-project-manager-db
          property: connectionString

  - type: web
    name: matriz-project-manager-web
    runtime: docker
    region: frankfurt
    plan: free
    branch: main
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    autoDeployTrigger: off
    envVars:
      - key: VITE_API_BASE_URL
        value: /api
      - key: API_URL
        fromService:
          name: matriz-project-manager-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: matriz-project-manager-db
    region: frankfurt
    plan: free
    postgresMajorVersion: "17"
    databaseName: matriz
    user: matriz
    ipAllowList: []
