openapi: 3.1.0
info:
  title: Matriz API
  version: 0.4.0
  description: |
    Contrato das rotas REST implementadas pelo backend Matriz. Os caminhos
    usam o prefixo /api e barras finais. As listagens devolvem arrays completos
    e não têm paginação.
servers:
  - url: /api
    description: Prefixo da API na origem da aplicação.
security:
  - sessionCookie: []
paths:
  /csrf/:
    get:
      operationId: getCsrfToken
      summary: Preparar token CSRF
      description: |
        Define o cookie CSRF para pedidos autenticados enviados pelo browser.
        Pedidos que alteram dados devem devolver o token no cabeçalho X-CSRFToken.
      security: []
      responses:
        "204":
          description: Cookie CSRF preparado.
          headers:
            Set-Cookie:
              schema:
                type: string
  /health/:
    get:
      operationId: getHealth
      summary: Verificar disponibilidade da API e da base de dados
      security: []
      responses:
        "200":
          description: API e ligação à base de dados disponíveis.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                  - database
                properties:
                  status:
                    type: string
                    const: ok
                  database:
                    type: string
                    const: ok
  /sessions/:
    post:
      operationId: createSession
      summary: Iniciar sessão
      description: |
        Autentica o utilizador com email e palavra-passe. Uma falha deve
        apresentar a mesma mensagem genérica para email inexistente e
        palavra-passe incorreta. Cria uma sessão de Django registada no
        servidor e envia o cookie sessionid. A duração da sessão ainda está
        por definir.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCreate"
      responses:
        "200":
          description: Sessão iniciada.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Credenciais inválidas, sem indicar se o email está registado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsError"
              example:
                code: invalid_credentials
                message: Email ou palavra-passe inválidos.
        "403":
          description: Pedido rejeitado pela proteção CSRF do Django.
          content:
            text/html:
              schema:
                type: string
  /sessions/current/:
    delete:
      operationId: deleteCurrentSession
      summary: Terminar sessão atual
      description: |
        Invalida a sessão atual de Django no servidor. Pedidos posteriores
        com o cookie invalidado devolvem 401.
      responses:
        "204":
          description: Sessão terminada.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /users/me/:
    get:
      operationId: getCurrentUser
      summary: Consultar o utilizador autenticado
      description: Devolve o email e o papel do utilizador da sessão atual.
      responses:
        "200":
          description: Utilizador autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /projects/:
    get:
      operationId: listProjects
      summary: Listar projetos acessíveis
      description: |
        Devolve apenas projetos a que o utilizador autenticado tem acesso,
        como gestor ou como membro.
        A pesquisa por nome não distingue maiúsculas de minúsculas.
        Quando não existem projetos acessíveis, devolve uma lista vazia.
      parameters:
        - name: name
          in: query
          required: false
          description: Pesquisa por nome nos projetos acessíveis ao utilizador.
          schema:
            type: string
            minLength: 1
            pattern: '\S'
      responses:
        "200":
          description: Lista de projetos acessíveis.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createProject
      summary: Criar projeto
      description: |
        Operação reservada ao Project Manager. O gestor responsável é sempre
        inferido da sessão autenticada; managerId não é aceite no pedido.
        O título tem 3 a 100 caracteres e a descrição opcional até 1000.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: Projeto criado.
          headers:
            Location:
              description: URI do projeto criado.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /projects/{projectId}/:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      summary: Consultar projeto
      description: Apenas utilizadores com acesso ao projeto podem consultá-lo.
      responses:
        "200":
          description: Projeto consultado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProject
      summary: Atualizar projeto
      description: Operação reservada ao Project Manager que gere o projeto.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Projeto atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProject
      summary: Eliminar projeto
      description: |
        Operação reservada ao Project Manager que gere o projeto. Tarefas,
        membros, responsáveis e comentários dependentes são eliminados em cascata.
      responses:
        "204":
          description: Projeto eliminado.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/members/:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectMembers
      summary: Listar membros do projeto
      description: |
        Requer acesso ao projeto. A lista inclui utilizadores ativos associados
        ao projeto e o gestor ativo, que conta implicitamente como membro.
      responses:
        "200":
          description: Utilizadores ativos elegíveis para atribuição, incluindo o gestor.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/tasks/:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectTasks
      summary: Listar e filtrar tarefas do projeto
      description: |
        Requer acesso ao projeto. Os filtros são opcionais e combinam-se
        quando são enviados. A resposta inclui todos os resultados e não é
        paginada.
      parameters:
        - name: status
          in: query
          required: false
          description: Filtra pelo estado da tarefa.
          schema:
            $ref: "#/components/schemas/TaskStatus"
        - name: assigneeId
          in: query
          required: false
          description: Filtra pelo identificador do responsável.
          schema:
            type: integer
            minimum: 1
        - name: priority
          in: query
          required: false
          description: Filtra pela prioridade da tarefa.
          schema:
            $ref: "#/components/schemas/TaskPriority"
      responses:
        "200":
          description: Tarefas do projeto que correspondem aos filtros.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createProjectTask
      summary: Criar tarefa num projeto
      description: |
        Operação reservada ao Project Manager que gere o projeto. A tarefa
        aceita título entre 3 e 150 caracteres, descrição opcional até 2000
        caracteres, estado e prioridade conforme os respetivos esquemas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
      responses:
        "201":
          description: Tarefa criada.
          headers:
            Location:
              description: URI da tarefa criada.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/tasks/{taskId}/:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: taskId
        in: path
        required: true
        description: Identificador da tarefa.
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getProjectTask
      summary: Consultar tarefa
      description: Apenas utilizadores com acesso ao projeto podem consultar a tarefa.
      responses:
        "200":
          description: Tarefa consultada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProjectTask
      summary: Atualizar tarefa
      description: |
        O Project Manager pode atualizar tarefas do projeto. O Developer só
        pode atualizar o estado de uma tarefa que lhe esteja atribuída. Os
        campos aceites dependem do papel e das permissões do utilizador.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Tarefa atualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProjectTask
      summary: Eliminar tarefa
      description: |
        Operação reservada ao Project Manager que gere o projeto. A política
        de eliminação em cascata remove responsáveis e comentários associados.
      responses:
        "204":
          description: Tarefa eliminada.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/tasks/{taskId}/assignees/:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: taskId
        in: path
        required: true
        description: Identificador da tarefa.
        schema:
          type: integer
          minimum: 1
    get:
      operationId: listTaskAssignees
      summary: Listar responsáveis da tarefa
      description: Requer acesso ao projeto.
      responses:
        "200":
          description: Responsáveis atuais da tarefa.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addTaskAssignee
      summary: Associar responsável à tarefa
      description: |
        Operação reservada ao gestor do projeto. O utilizador tem de estar
        ativo e ser membro do projeto ou o seu gestor. Uma associação já
        existente devolve 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskAssigneeCreate"
      responses:
        "201":
          description: Responsável associado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: O utilizador já está associado à tarefa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiDetailError"
    put:
      operationId: replaceTaskAssignees
      summary: Substituir responsáveis da tarefa
      description: |
        Operação reservada ao Project Manager que gere o projeto. A lista
        substitui integralmente as associações atuais. Os identificadores
        têm de ser distintos e pertencer a utilizadores ativos membros do
        projeto ou ao gestor. Uma lista vazia remove todos os responsáveis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskAssigneesUpdate"
      responses:
        "200":
          description: Responsáveis atualizados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/tasks/{taskId}/assignees/{userId}/:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: taskId
        in: path
        required: true
        description: Identificador da tarefa.
        schema:
          type: integer
          minimum: 1
      - name: userId
        in: path
        required: true
        description: Identificador do responsável.
        schema:
          type: integer
          minimum: 1
    delete:
      operationId: removeTaskAssignee
      summary: Remover responsável da tarefa
      description: Operação reservada ao gestor do projeto.
      responses:
        "204":
          description: Responsável removido.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/tasks/{taskId}/comments/:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: taskId
        in: path
        required: true
        description: Identificador da tarefa.
        schema:
          type: integer
          minimum: 1
    get:
      operationId: listTaskComments
      summary: Listar comentários da tarefa
      description: |
        Requer acesso ao projeto. A ordenação é ascendente por data de criação
        e, em caso de empate, pelo identificador do comentário.
      responses:
        "200":
          description: Comentários com autor e data de criação.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createTaskComment
      summary: Adicionar comentário à tarefa
      description: |
        Requer acesso ao projeto. O autor é o utilizador autenticado e a data
        é atribuída pelo servidor. O conteúdo é obrigatório, tem entre 1 e
        2000 caracteres e não pode ser composto apenas por espaços.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentCreate"
      responses:
        "201":
          description: Comentário criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sessionid
      description: |
        Cookie de sessão persistido pelo backend de sessões do Django. Pedidos
        que alteram dados devem também enviar o token CSRF no cabeçalho
        X-CSRFToken.
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      description: Identificador do projeto.
      schema:
        type: integer
        minimum: 1
  schemas:
    ApiDetailError:
      type: object
      additionalProperties: false
      required:
        - detail
      properties:
        detail:
          type: string
    CredentialsError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          const: invalid_credentials
        message:
          type: string
    ValidationError:
      type: object
      additionalProperties:
        oneOf:
          - type: string
          - type: array
            items:
              type: string
    User:
      type: object
      additionalProperties: false
      required:
        - userId
        - email
        - role
        - isActive
      properties:
        userId:
          type: integer
          minimum: 1
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
        isActive:
          type: boolean
    UserRole:
      type: string
      enum:
        - ADMIN
        - PROJECT_MANAGER
        - DEVELOPER
    SessionCreate:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
    Session:
      type: object
      additionalProperties: false
      required:
        - user
      properties:
        user:
          $ref: "#/components/schemas/User"
    Project:
      type: object
      additionalProperties: false
      required:
        - projectId
        - managerId
        - title
        - description
      properties:
        projectId:
          type: integer
          minimum: 1
        managerId:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 3
          maxLength: 100
          pattern: '\S'
          description: Título após remoção de espaços externos.
        description:
          type: string
          maxLength: 1000
    ProjectCreate:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 100
          pattern: '\S'
          description: Título após remoção de espaços externos.
        description:
          type:
            - string
            - "null"
          maxLength: 1000
    ProjectUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 100
          pattern: '\S'
          description: Título após remoção de espaços externos.
        description:
          type:
            - string
            - "null"
          maxLength: 1000
    ProjectMember:
      type: object
      additionalProperties: false
      required:
        - userId
        - email
        - role
      properties:
        userId:
          type: integer
          minimum: 1
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
    TaskStatus:
      type: string
      enum:
        - TODO
        - IN_PROGRESS
        - DONE
      default: TODO
      description: Códigos persistidos; a interface apresenta rótulos em português.
    TaskPriority:
      type: string
      enum:
        - LOW
        - MEDIUM
        - HIGH
      default: MEDIUM
      description: Códigos persistidos; a interface apresenta rótulos em português.
    TaskCreate:
      type: object
      additionalProperties: false
      description: >
        Os valores omitidos de estado e prioridade assumem TODO e MEDIUM.
      required:
        - title
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 150
          pattern: '\S'
          description: Título entre 3 e 150 caracteres, sem ser só espaços.
        description:
          type:
            - string
            - "null"
          maxLength: 2000
        status:
          $ref: "#/components/schemas/TaskStatus"
          default: TODO
        priority:
          $ref: "#/components/schemas/TaskPriority"
          default: MEDIUM
    TaskUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 150
          pattern: '\S'
          description: Título entre 3 e 150 caracteres, sem ser só espaços.
        description:
          type:
            - string
            - "null"
          maxLength: 2000
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"
    Task:
      type: object
      additionalProperties: false
      required:
        - taskId
        - projectId
        - assigneeIds
        - title
        - description
        - status
        - priority
      properties:
        taskId:
          type: integer
          minimum: 1
        projectId:
          type: integer
          minimum: 1
        assigneeIds:
          type: array
          uniqueItems: true
          description: Identificadores dos utilizadores responsáveis.
          items:
            type: integer
            minimum: 1
        priority:
          $ref: "#/components/schemas/TaskPriority"
        title:
          type: string
          minLength: 3
          maxLength: 150
        description:
          type: string
          maxLength: 2000
        status:
          $ref: "#/components/schemas/TaskStatus"
    TaskAssigneesUpdate:
      type: object
      additionalProperties: false
      required:
        - assigneeIds
      properties:
        assigneeIds:
          type: array
          uniqueItems: true
          items:
            type: integer
            minimum: 1
    TaskAssigneeCreate:
      type: object
      additionalProperties: false
      required:
        - userId
      properties:
        userId:
          type: integer
          minimum: 1
    CommentCreate:
      type: object
      additionalProperties: false
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: '\S'
          description: Conteúdo obrigatório, 1–2000 caracteres e não só espaços.
    Comment:
      type: object
      additionalProperties: false
      required:
        - commentId
        - taskId
        - author
        - content
        - createdAt
      properties:
        commentId:
          type: integer
          minimum: 1
        taskId:
          type: integer
          minimum: 1
        author:
          $ref: "#/components/schemas/ProjectMember"
        content:
          type: string
          minLength: 1
          maxLength: 2000
        createdAt:
          type: string
          format: date-time
  responses:
    BadRequest:
      description: Pedido inválido ou campos obrigatórios inválidos.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
          example:
            title:
              - This field is required.
    Unauthorized:
      description: Autenticação em falta ou inválida.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiDetailError"
          example:
            detail: Authentication credentials were not provided.
    Forbidden:
      description: Utilizador autenticado sem permissão para executar a operação.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiDetailError"
          example:
            detail: You do not have permission to perform this action.
    NotFound:
      description: Recurso inexistente ou não acessível ao utilizador.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiDetailError"
          example:
            detail: Not found.
