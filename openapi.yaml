openapi: 3.1.0
info:
  title: Matriz API
  version: 0.4.0
  description: |
    Contrato REST proposto para as operações desta fase do Matriz.
    Os caminhos concretos e alguns detalhes do contrato são propostas de API;
    os códigos de estado, prioridade e papel refletem as escolhas da estrutura
    inicial. As regras de autorização ainda carecem de validação.
servers:
  - url: /
    description: Base relativa à origem da aplicação; o alojamento ainda não foi definido.
security:
  - sessionCookie: []
paths:
  /csrf:
    get:
      operationId: getCsrfToken
      summary: Preparar token CSRF
      description: |
        Define o cookie CSRF para pedidos autenticados enviados pelo browser.
        Pedidos que alteram dados devem devolver o token no cabeçalho X-CSRFToken.
      security: []
      responses:
        "204":
          description: Cookie CSRF preparado.
          headers:
            Set-Cookie:
              schema:
                type: string
  /sessions:
    post:
      operationId: createSession
      summary: Iniciar sessão
      description: |
        Autentica o utilizador com email e palavra-passe. Uma falha deve
        apresentar a mesma mensagem genérica para email inexistente e
        palavra-passe incorreta. Cria uma sessão de Django registada no
        servidor e envia o cookie sessionid. A duração da sessão ainda está
        por definir.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCreate"
      responses:
        "200":
          description: Sessão iniciada.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Credenciais inválidas, sem indicar se o email está registado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sessions/current:
    delete:
      operationId: deleteCurrentSession
      summary: Terminar sessão atual
      description: |
        Invalida a sessão atual de Django no servidor. Pedidos posteriores
        com o cookie invalidado devolvem 401.
      responses:
        "204":
          description: Sessão terminada.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users:
    get:
      operationId: listUsers
      summary: Consultar utilizadores da equipa
      description: Operação reservada ao Admin.
      responses:
        "200":
          description: Utilizadores existentes e respetivos papéis.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /users/me:
    get:
      operationId: getCurrentUser
      summary: Consultar o utilizador autenticado
      description: Devolve o email e o papel do utilizador da sessão atual.
      responses:
        "200":
          description: Utilizador autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/me/tasks:
    get:
      operationId: listMyTasks
      summary: Listar as tarefas atribuídas ao utilizador autenticado
      description: |
        Devolve as tarefas atribuídas ao utilizador autenticado em todos os
        projetos a que tem acesso. Os filtros por estado e prioridade são opcionais.
      parameters:
        - name: status
          in: query
          required: false
          description: Filtra pelo estado da tarefa.
          schema:
            $ref: "#/components/schemas/TaskStatus"
        - name: priority
          in: query
          required: false
          description: Filtra pela prioridade da tarefa.
          schema:
            $ref: "#/components/schemas/TaskPriority"
      responses:
        "200":
          description: Tarefas atribuídas ao utilizador.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/{userId}:
    patch:
      operationId: updateUserRole
      summary: Atribuir papel a um utilizador
      description: |
        Operação reservada ao Admin; altera apenas o papel do utilizador.
        É recusada com 409 se o utilizador gerir projetos e o novo papel
        for diferente de Project Manager.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRoleUpdate"
      responses:
        "200":
          description: Papel atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: O utilizador gere projetos e não pode deixar de ser Project Manager.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects:
    get:
      operationId: listProjects
      summary: Listar projetos acessíveis
      description: |
        Devolve apenas projetos a que o utilizador autenticado tem acesso,
        como gestor ou como membro.
        A pesquisa por nome não distingue maiúsculas de minúsculas.
        Quando não existem projetos acessíveis, devolve uma lista vazia.
      parameters:
        - name: name
          in: query
          required: false
          description: Pesquisa por nome nos projetos acessíveis ao utilizador.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Lista de projetos acessíveis.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createProject
      summary: Criar projeto
      description: |
        Operação reservada ao Project Manager. O gestor responsável é sempre
        inferido da sessão autenticada; managerId não é aceite no pedido.
        O título tem 3 a 100 caracteres e a descrição opcional até 1000.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: Projeto criado.
          headers:
            Location:
              description: URI do projeto criado.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      summary: Consultar projeto
      description: Apenas utilizadores com acesso ao projeto podem consultá-lo.
      responses:
        "200":
          description: Projeto consultado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProject
      summary: Atualizar projeto
      description: Operação reservada ao Project Manager que gere o projeto.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Projeto atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProject
      summary: Eliminar projeto
      description: |
        Operação reservada ao Project Manager que gere o projeto. Tarefas,
        membros, responsáveis e comentários dependentes são eliminados em cascata.
      responses:
        "204":
          description: Projeto eliminado.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectMembers
      summary: Listar membros do projeto
      description: |
        Requer acesso ao projeto. A lista inclui utilizadores ativos associados
        ao projeto e o gestor ativo, que conta implicitamente como membro.
      responses:
        "200":
          description: Utilizadores ativos elegíveis para atribuição, incluindo o gestor.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addProjectMember
      summary: Associar membro ao projeto
      description: |
        Operação reservada ao Project Manager que gere o projeto. Se o
        utilizador já for membro ou for o gestor do projeto, devolve 409 e a
        lista de membros não é alterada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMemberCreate"
      responses:
        "201":
          description: Utilizador associado ao projeto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: O utilizador já está associado ao projeto ou é o seu gestor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{projectId}/eligible-members:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listEligibleProjectMembers
      summary: Listar utilizadores elegíveis para associar ao projeto
      description: |
        Operação reservada ao Project Manager responsável. Devolve utilizadores
        que podem ser associados ao projeto.
        A política de elegibilidade (por exemplo, conta ativa) carece de validação.
      responses:
        "200":
          description: Utilizadores elegíveis para associação ao projeto.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/tasks:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectTasks
      summary: Listar e filtrar tarefas do projeto
      description: |
        Requer acesso ao projeto. Os filtros são opcionais e combinam-se
        quando são enviados.
      parameters:
        - name: status
          in: query
          required: false
          description: Filtra pelo estado da tarefa.
          schema:
            $ref: "#/components/schemas/TaskStatus"
        - name: assigneeId
          in: query
          required: false
          description: Filtra pelo identificador do responsável.
          schema:
            type: integer
            minimum: 1
        - name: priority
          in: query
          required: false
          description: Filtra pela prioridade da tarefa.
          schema:
            $ref: "#/components/schemas/TaskPriority"
      responses:
        "200":
          description: Tarefas do projeto que correspondem aos filtros.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createProjectTask
      summary: Criar tarefa num projeto
      description: |
        Operação reservada ao Project Manager que gere o projeto. A tarefa
        aceita título entre 3 e 150 caracteres, descrição opcional até 2000
        caracteres, estado e prioridade conforme os respetivos esquemas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
      responses:
        "201":
          description: Tarefa criada.
          headers:
            Location:
              description: URI da tarefa criada.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: taskId
        in: path
        required: true
        description: Identificador da tarefa.
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getProjectTask
      summary: Consultar tarefa
      description: Apenas utilizadores com acesso ao projeto podem consultar a tarefa.
      responses:
        "200":
          description: Tarefa consultada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProjectTask
      summary: Atualizar tarefa
      description: |
        O Project Manager pode atualizar tarefas do projeto. O Developer só
        pode atualizar o estado de uma tarefa que lhe esteja atribuída. Os
        campos aceites dependem do papel e das permissões do utilizador. Um
        novo responsável tem de ser membro do projeto (incluindo o gestor).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Tarefa atualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProjectTask
      summary: Eliminar tarefa
      description: |
        Operação reservada ao Project Manager que gere o projeto. A política
        de eliminação em cascata remove responsáveis e comentários associados.
      responses:
        "204":
          description: Tarefa eliminada.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/tasks/{taskId}/assignees:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: taskId
        in: path
        required: true
        description: Identificador da tarefa.
        schema:
          type: integer
          minimum: 1
    get:
      operationId: listTaskAssignees
      summary: Listar responsáveis da tarefa
      description: Requer acesso ao projeto.
      responses:
        "200":
          description: Responsáveis atuais da tarefa.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addTaskAssignee
      summary: Associar responsável à tarefa
      description: |
        Operação reservada ao gestor do projeto. O utilizador tem de estar
        ativo e ser membro do projeto ou o seu gestor. Uma associação já
        existente devolve 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskAssigneeCreate"
      responses:
        "201":
          description: Responsável associado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: O utilizador já está associado à tarefa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: replaceTaskAssignees
      summary: Substituir responsáveis da tarefa
      description: |
        Operação reservada ao Project Manager que gere o projeto. A lista
        substitui integralmente as associações atuais. Os identificadores
        têm de ser distintos e pertencer a utilizadores ativos membros do
        projeto ou ao gestor. Uma lista vazia remove todos os responsáveis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskAssigneesUpdate"
      responses:
        "200":
          description: Responsáveis atualizados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/tasks/{taskId}/assignees/{userId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: taskId
        in: path
        required: true
        description: Identificador da tarefa.
        schema:
          type: integer
          minimum: 1
      - name: userId
        in: path
        required: true
        description: Identificador do responsável.
        schema:
          type: integer
          minimum: 1
    delete:
      operationId: removeTaskAssignee
      summary: Remover responsável da tarefa
      description: Operação reservada ao gestor do projeto.
      responses:
        "204":
          description: Responsável removido.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/tasks/{taskId}/comments:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: taskId
        in: path
        required: true
        description: Identificador da tarefa.
        schema:
          type: integer
          minimum: 1
    get:
      operationId: listTaskComments
      summary: Listar comentários da tarefa
      description: Requer acesso ao projeto.
      responses:
        "200":
          description: Comentários com autor e data de criação.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createTaskComment
      summary: Adicionar comentário à tarefa
      description: |
        Requer acesso ao projeto. O autor é o utilizador autenticado e a data
        é atribuída pelo servidor. O conteúdo é obrigatório, tem entre 1 e
        2000 caracteres e não pode ser composto apenas por espaços.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentCreate"
      responses:
        "201":
          description: Comentário criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/progress:
    get:
      operationId: getProjectProgress
      summary: Consultar progresso do projeto
      description: |
        Devolve contagens atuais por estado e as tarefas em aberto
        (estado diferente de DONE).
        Disponível a qualquer utilizador com acesso ao projeto.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Resumo atual do progresso do projeto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectProgress"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /dashboard:
    get:
      operationId: getDashboard
      summary: Consultar painel inicial
      description: |
        Devolve os projetos acessíveis ao utilizador autenticado e as
        contagens atuais de tarefas por estado em cada projeto.
      responses:
        "200":
          description: Projetos acessíveis e respetivas contagens por estado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sessionid
      description: |
        Cookie de sessão persistido pelo backend de sessões do Django. Pedidos
        que alteram dados devem também enviar o token CSRF no cabeçalho
        X-CSRFToken.
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      description: Identificador do projeto.
      schema:
        type: integer
        minimum: 1
    UserId:
      name: userId
      in: path
      required: true
      description: Identificador do utilizador.
      schema:
        type: integer
        minimum: 1
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    User:
      type: object
      additionalProperties: false
      required:
        - userId
        - email
        - role
      properties:
        userId:
          type: integer
          minimum: 1
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
        isActive:
          type: boolean
    UserRole:
      type: string
      enum:
        - ADMIN
        - PROJECT_MANAGER
        - DEVELOPER
    UserRoleUpdate:
      type: object
      additionalProperties: false
      required:
        - role
      properties:
        role:
          $ref: "#/components/schemas/UserRole"
    SessionCreate:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
    Session:
      type: object
      additionalProperties: false
      required:
        - user
      properties:
        user:
          $ref: "#/components/schemas/User"
    Project:
      type: object
      additionalProperties: false
      required:
        - projectId
        - managerId
        - title
      properties:
        projectId:
          type: integer
          minimum: 1
        managerId:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 3
          maxLength: 100
          pattern: '\S'
          description: Título após remoção de espaços externos.
        description:
          type:
            - string
            - "null"
          maxLength: 1000
    ProjectCreate:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 100
