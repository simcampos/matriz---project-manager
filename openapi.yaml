openapi: 3.1.0
info:
  title: Matriz API
  version: 0.3.0
  description: |
    Contrato REST proposto para as operações documentadas do MVP Matriz.
    Os caminhos concretos e alguns detalhes do contrato são propostas de API;
    os papéis, estados e regras de negócio identificados como provisórios
    carecem de validação nos documentos do produto.
servers:
  - url: /
    description: Base relativa à origem da aplicação; o alojamento ainda não foi definido.
security:
  - bearerAuth: []
paths:
  /sessions:
    post:
      operationId: createSession
      summary: Iniciar sessão
      description: |
        Autentica o utilizador com email e palavra-passe. Uma falha deve
        apresentar a mesma mensagem genérica para email inexistente e
        palavra-passe incorreta. Cria uma sessão registada no servidor. A
        devolução de bearer token é provisória; o formato do token e a
        expiração ainda não foram decididos.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCreate"
      responses:
        "201":
          description: Sessão iniciada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Credenciais inválidas, sem indicar se o email está registado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sessions/current:
    delete:
      operationId: deleteCurrentSession
      summary: Terminar sessão atual
      description: |
        Invalida a sessão atual no servidor. Pedidos posteriores com a mesma
        credencial devolvem 401.
      responses:
        "204":
          description: Sessão terminada.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users:
    get:
      operationId: listUsers
      summary: Consultar utilizadores da equipa
      description: Operação reservada ao Admin.
      responses:
        "200":
          description: Utilizadores existentes e respetivos papéis.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /users/me:
    get:
      operationId: getCurrentUser
      summary: Consultar o utilizador autenticado
      description: Devolve o email e o papel do utilizador da sessão atual.
      responses:
        "200":
          description: Utilizador autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/me/tasks:
    get:
      operationId: listMyTasks
      summary: Listar as tarefas atribuídas ao utilizador autenticado
      description: |
        Devolve as tarefas atribuídas ao utilizador autenticado em todos os
        projetos a que tem acesso. O filtro por estado é opcional.
      parameters:
        - name: status
          in: query
          required: false
          description: Filtra pelo estado da tarefa.
          schema:
            $ref: "#/components/schemas/TaskStatus"
      responses:
        "200":
          description: Tarefas atribuídas ao utilizador.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/{userId}:
    patch:
      operationId: updateUserRole
      summary: Atribuir papel a um utilizador
      description: |
        Operação reservada ao Admin; altera apenas o papel do utilizador.
        É recusada com 409 se o utilizador gerir projetos e o novo papel
        for diferente de Project Manager.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRoleUpdate"
      responses:
        "200":
          description: Papel atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: O utilizador gere projetos e não pode deixar de ser Project Manager.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects:
    get:
      operationId: listProjects
      summary: Listar projetos acessíveis
      description: |
        Devolve apenas projetos a que o utilizador autenticado tem acesso,
        como gestor ou como membro.
        Quando não existem projetos acessíveis, devolve uma lista vazia.
      responses:
        "200":
          description: Lista de projetos acessíveis.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createProject
      summary: Criar projeto
      description: |
        Operação reservada ao Project Manager. O gestor responsável é o
        utilizador autenticado. Título obrigatório e descrição opcional são
        propostas ainda sujeitas a confirmação.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: Projeto criado.
          headers:
            Location:
              description: URI do projeto criado.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      summary: Consultar projeto
      description: Apenas utilizadores com acesso ao projeto podem consultá-lo.
      responses:
        "200":
          description: Projeto consultado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProject
      summary: Atualizar projeto
      description: Operação reservada ao Project Manager que gere o projeto.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Projeto atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectMembers
      summary: Listar membros do projeto
      description: |
        Requer acesso ao projeto. A lista inclui o gestor do projeto, que
        conta implicitamente como membro.
      responses:
        "200":
          description: Utilizadores associados ao projeto.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addProjectMember
      summary: Associar membro ao projeto
      description: |
        Operação reservada ao Project Manager que gere o projeto. Se o
        utilizador já for membro ou for o gestor do projeto, devolve 409 e a
        lista de membros não é alterada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMemberCreate"
      responses:
        "201":
          description: Utilizador associado ao projeto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: O utilizador já está associado ao projeto ou é o seu gestor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{projectId}/tasks:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectTasks
      summary: Listar e filtrar tarefas do projeto
      description: |
        Requer acesso ao projeto. Os filtros são opcionais e combinam-se
        quando ambos são enviados.
      parameters:
        - name: status
          in: query
          required: false
          description: Filtra pelo estado da tarefa.
          schema:
            $ref: "#/components/schemas/TaskStatus"
        - name: assigneeId
          in: query
          required: false
          description: Filtra pelo identificador do responsável.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Tarefas do projeto que correspondem aos filtros.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createProjectTask
      summary: Criar tarefa num projeto
      description: |
        Operação reservada ao Project Manager que gere o projeto. Se for
        indicado um responsável, este tem de ser membro do projeto (o gestor
        do projeto conta como membro).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
      responses:
        "201":
          description: Tarefa criada.
          headers:
            Location:
              description: URI da tarefa criada.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: taskId
        in: path
        required: true
        description: Identificador da tarefa.
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getProjectTask
      summary: Consultar tarefa
      description: Apenas utilizadores com acesso ao projeto podem consultar a tarefa.
      responses:
        "200":
          description: Tarefa consultada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProjectTask
      summary: Atualizar tarefa
      description: |
        O Project Manager pode atualizar tarefas do projeto. O Developer só
        pode atualizar o estado de uma tarefa que lhe esteja atribuída. Os
        campos aceites dependem do papel e das permissões do utilizador. Um
        novo responsável tem de ser membro do projeto (incluindo o gestor).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Tarefa atualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/progress:
    get:
      operationId: getProjectProgress
      summary: Consultar progresso do projeto
      description: |
        Devolve contagens atuais por estado e as tarefas em aberto
        (estado diferente de "Concluída", conforme proposta a validar).
        Disponível a qualquer utilizador com acesso ao projeto.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Resumo atual do progresso do projeto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectProgress"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Esquema provisório. O formato do token e o ciclo de vida da sessão
        ainda não foram definidos nos requisitos do MVP.
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      description: Identificador do projeto.
      schema:
        type: integer
        minimum: 1
    UserId:
      name: userId
      in: path
      required: true
      description: Identificador do utilizador.
      schema:
        type: integer
        minimum: 1
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    User:
      type: object
      additionalProperties: false
      required:
        - userId
        - email
        - role
      properties:
        userId:
          type: integer
          minimum: 1
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
        isActive:
          type: boolean
    UserRole:
      type: string
      enum:
        - Admin
        - Project Manager
        - Developer
    UserRoleUpdate:
      type: object
      additionalProperties: false
      required:
        - role
      properties:
        role:
          $ref: "#/components/schemas/UserRole"
    SessionCreate:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
    Session:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - tokenType
        - user
      properties:
        accessToken:
          type: string
          description: Token provisório; o formato ainda não foi decidido.
        tokenType:
          type: string
          const: Bearer
        user:
          $ref: "#/components/schemas/User"
    Project:
      type: object
      additionalProperties: false
      required:
        - projectId
        - managerId
        - title
      properties:
        projectId:
          type: integer
          minimum: 1
        managerId:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          pattern: '\S'
          description: Título não pode ser composto apenas por espaços.
        description:
          type:
            - string
            - "null"
    ProjectCreate:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          pattern: '\S'
          description: Título não pode ser composto apenas por espaços.
        description:
          type:
            - string
            - "null"
    ProjectUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          pattern: '\S'
          description: Título não pode ser composto apenas por espaços.
        description:
          type:
            - string
            - "null"
    ProjectMember:
      type: object
      additionalProperties: false
      required:
        - userId
        - email
        - role
      properties:
        userId:
          type: integer
          minimum: 1
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
    ProjectMemberCreate:
      type: object
      additionalProperties: false
      required:
        - userId
      properties:
        userId:
          type: integer
          minimum: 1
    TaskStatus:
      type: string
      enum:
        - Por fazer
        - Em progresso
        - Concluída
      description: Estados propostos para o MVP, ainda sujeitos a confirmação.
    TaskCreate:
      type: object
      additionalProperties: false
      required:
        - title
        - status
      properties:
        title:
          type: string
          minLength: 1
          pattern: '\S'
          description: Título não pode ser composto apenas por espaços.
        description:
          type:
            - string
            - "null"
        status:
          $ref: "#/components/schemas/TaskStatus"
        assigneeId:
          type:
            - integer
            - "null"
          minimum: 1
    TaskUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          pattern: '\S'
          description: Título não pode ser composto apenas por espaços.
        description:
          type:
            - string
            - "null"
        status:
          $ref: "#/components/schemas/TaskStatus"
        assigneeId:
          type:
            - integer
            - "null"
          minimum: 1
    Task:
      type: object
      additionalProperties: false
      required:
        - taskId
        - projectId
        - assigneeId
        - title
        - status
      properties:
        taskId:
          type: integer
          minimum: 1
        projectId:
          type: integer
          minimum: 1
        assigneeId:
          type:
            - integer
            - "null"
          minimum: 1
        title:
          type: string
          minLength: 1
        description:
          type:
            - string
            - "null"
        status:
          $ref: "#/components/schemas/TaskStatus"
    ProjectProgress:
      type: object
      additionalProperties: false
      required:
        - projectId
        - countsByStatus
        - openTasks
      properties:
        projectId:
          type: integer
          minimum: 1
        countsByStatus:
          type: object
          additionalProperties: false
          required:
            - Por fazer
            - Em progresso
            - Concluída
          properties:
            Por fazer:
              type: integer
              minimum: 0
            Em progresso:
              type: integer
              minimum: 0
            Concluída:
              type: integer
              minimum: 0
        openTasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
  responses:
    BadRequest:
      description: Pedido inválido ou campos obrigatórios inválidos.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: invalid_request
            message: O pedido contém campos inválidos.
    Unauthorized:
      description: Autenticação em falta ou inválida.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: unauthorized
            message: Autenticação necessária.
    Forbidden:
      description: Utilizador autenticado sem permissão para executar a operação.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: forbidden
            message: Não tem permissão para executar esta operação.
    NotFound:
      description: Recurso inexistente ou não acessível ao utilizador.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: not_found
            message: Recurso não encontrado.
